<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14532d">
    <title>ReservePro</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #14532d;
            color: #fff;
        }
        .loader {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255,255,255,.25);
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 1rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <strong>ReservePro</strong>
        <div>Loading resort app…</div>
    </div>
    <script>
        // Fallback if Capacitor server.url is not configured yet.
        var productionUrl = 'https://YOUR-PRODUCTION-URL.onrender.com';
        if (!window.Capacitor) {
            window.location.replace(productionUrl);
        }
    </script>
</body>
</html>
