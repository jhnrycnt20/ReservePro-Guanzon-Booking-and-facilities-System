services:
  - type: web
    name: reservepro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ReservePro
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # Prefer RENDER_EXTERNAL_URL in entrypoint (includes https://).
      # Keep this as a fallback hostname only — never use host without a scheme in Laravel.
      - key: APP_URL
        fromService:
          type: web
          name: reservepro
          property: host
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      # File sessions + CSRF refresh before login (cookie driver caused 500s on Render).
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: LOG_CHANNEL
        value: stderr
      # Gmail SMTP — set MAIL_PASSWORD in the Render dashboard (sync: false = secret, not in git).
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_ENCRYPTION
        value: ssl
      # Must match the Gmail account that owns the App Password set in the dashboard.
      - key: MAIL_USERNAME
        value: johnreycanete2001@gmail.com
      - key: MAIL_FROM_ADDRESS
        value: johnreycanete2001@gmail.com
      - key: MAIL_FROM_NAME
        value: ReservePro
      # Secret: set this manually in Render → Environment (Gmail 16-char App Password).
      # Blueprint sync:false does not copy your local .env password.
      - key: MAIL_PASSWORD
        sync: false
