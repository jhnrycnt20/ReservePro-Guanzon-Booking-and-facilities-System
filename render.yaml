services:
  - type: web
    name: reservepro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ReservePro
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # Prefer RENDER_EXTERNAL_URL in entrypoint (includes https://).
      # Keep this as a fallback hostname only — never use host without a scheme in Laravel.
      - key: APP_URL
        fromService:
          type: web
          name: reservepro
          property: host
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      # File sessions + CSRF refresh before login (cookie driver caused 500s on Render).
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: LOG_CHANNEL
        value: stderr
