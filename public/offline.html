<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14532d">
    <title>Offline — ReservePro</title>
    <style>
        :root {
            --rp-bg: #f4f7f5;
            --rp-text: #1c2b24;
            --rp-accent: #14532d;
            --rp-display: Georgia, serif;
            --rp-font: system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: var(--rp-font);
            color: var(--rp-text);
            background:
                radial-gradient(circle at top left, rgba(20, 83, 45, 0.12), transparent 40%),
                radial-gradient(circle at bottom right, rgba(31, 122, 77, 0.1), transparent 35%),
                var(--rp-bg);
            text-align: center;
        }
        .card {
            max-width: 26rem;
            background: #fff;
            border-radius: 1rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 30px rgba(22, 53, 40, 0.08);
        }
        h1 {
            font-family: var(--rp-display);
            font-size: 1.75rem;
            margin: 0 0 0.5rem;
            color: var(--rp-accent);
        }
        p {
            margin: 0 0 1.25rem;
            color: #5f6f66;
            line-height: 1.5;
        }
        button {
            border: 0;
            border-radius: 0.65rem;
            background: var(--rp-accent);
            color: #fff;
            font-weight: 600;
            padding: 0.7rem 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>ReservePro needs an internet connection for bookings and live availability. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
